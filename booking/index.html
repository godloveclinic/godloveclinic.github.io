<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>主愛心理諮商｜預約</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preload" href="huninn-sub-v1.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Huninn";src:url(huninn-sub-v1.woff2) format("woff2");font-display:swap}</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<style>

:root{--bg:#f4efe6;--card:#fff;--ink:#3d3a35;--mute:#8a8378;--line:#e6ddcd;--main:#7a9e7e;--main-d:#5f8463;--soft:#eef4ee;--warn:#c96f5b;--gold:#c9952e;--chat:#8cabd9;--bub:#fff;--me:#a6e27a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:#3d3a35;color:#fff;padding:9px 12px 8px}
.top .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.clock{font-size:17px;font-weight:700;letter-spacing:.5px}
.clock small{font-weight:400;opacity:.7;font-size:12px;margin-left:4px}
.tb{border:0;border-radius:8px;padding:6px 10px;background:#5a564f;color:#fff;font-size:13px}
.tb.hl{background:var(--gold)}
.quota{font-size:12px;opacity:.85;margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.quota b{color:#ffd57a}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:var(--toph,74px);z-index:15;overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;background:none;padding:11px 10px;font-size:14px;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap;position:relative}
.tabs button.on{color:var(--main-d);border-bottom-color:var(--main);font-weight:700}
.dot{display:inline-block;min-width:17px;height:17px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:17px;padding:0 4px;margin-left:3px;vertical-align:1px}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(60,50,30,.07)}
.card h3{margin:0 0 10px;font-size:15px}
.hint{font-size:12px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:13px}
.chip.on{border-color:var(--main);background:var(--soft);color:var(--main-d);font-weight:700}
/* LINE 聊天 */
.phone{background:var(--chat);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;height:min(560px,calc(100vh - 230px));min-height:380px}
.phone .bar{background:#2c3e57;color:#fff;padding:10px 12px;font-weight:700;font-size:14px;display:flex;justify-content:space-between}
.msgs{flex:1;overflow-y:auto;padding:10px}
.m{display:flex;margin:8px 0;gap:6px;align-items:flex-end}
.m.me{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.b{max-width:78%;background:var(--bub);border-radius:16px;padding:8px 11px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.me .b{background:var(--me)}
.t{font-size:10px;color:#eef;white-space:nowrap}
.cf{background:#fff;border-radius:14px;max-width:80%;overflow:hidden}
.cf .tx{padding:10px 12px;white-space:pre-wrap;font-size:14px}
.cf .ac{display:flex;border-top:1px solid #eee}
.cf .ac button{flex:1;border:0;background:#fff;padding:10px;color:#2a6fd6;font-weight:700}
.cf .ac button+button{border-left:1px solid #eee}
.cf .ac button:disabled{color:#bbb}
.tag{font-size:10px;padding:1px 6px;border-radius:8px;margin-left:4px}
.tag.push{background:#fde7c2;color:#8a5a00}
.tag.reply{background:#d9f0da;color:#2f6b34}
.menu{display:grid;grid-template-columns:1fr 1fr;background:#fff}
.menu button{border:0;border-top:1px solid #ddd;background:#fff;padding:14px 0;font-weight:700;color:var(--main-d);font-size:15px}
.menu button+button{border-left:1px solid #ddd}
.inp{display:flex;gap:6px;padding:8px;background:#f2f2f2}
.inp input{flex:1;border:1px solid #ddd;border-radius:18px;padding:7px 12px;background:#fff}
.inp button{border:0;background:var(--main);color:#fff;border-radius:18px;padding:0 14px}
/* 預約頁 (LIFF) */
.liff{position:fixed;inset:0;z-index:50;background:#faf6ef;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.liff header{background:var(--main);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
.liff header h2{margin:0;font-size:18px}
.liff header button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:50%;width:32px;height:32px;font-size:16px}
.liff .wrap{padding:14px;max-width:520px;margin:0 auto}
.ltabs{display:flex;background:#fff;border-radius:10px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
.ltabs button{flex:1;border:0;background:#fff;padding:10px;color:var(--mute)}
.ltabs button.on{background:var(--soft);color:var(--main-d);font-weight:700}
.step{font-size:13px;color:var(--main-d);font-weight:700;margin:0 0 9px}
.dates{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px}
.date{flex:0 0 60px;border:1.5px solid var(--line);border-radius:11px;padding:7px 0;text-align:center;background:#fff}
.date b{display:block;font-size:16px}.date small{font-size:11px;color:var(--mute)}
.date.on{border-color:var(--main);background:var(--soft)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.time{border:1.5px solid var(--line);border-radius:10px;padding:10px 0;background:#fff;font-size:15px}
.time.on{border-color:var(--main);background:var(--main);color:#fff;font-weight:700}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.f{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff}
.f:focus{outline:none;border-color:var(--main)}
.radios{display:flex;gap:7px}
.radios button{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 0;background:#fff}
.radios button.on{border-color:var(--main);background:var(--soft);color:var(--main-d);font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:11px;padding:13px;font-size:16px;font-weight:700;background:var(--main);color:#fff}
.btn:disabled{background:#c9c3b8}
.btn.ghost{background:#fff;color:var(--main-d);border:1.5px solid var(--main)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px}
.err{background:#fbe9e5;color:#9b4636;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.ok{background:var(--soft);color:var(--main-d);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.summary{background:var(--soft);border-radius:10px;padding:10px;margin-bottom:10px}
.bk{display:flex;align-items:center;gap:10px}
.bk .info{flex:1}
.badge{display:inline-block;font-size:11px;border-radius:20px;padding:1px 8px;margin-left:5px;vertical-align:1px}
.st-待確認{background:#fbf1dc;color:#9a6d12}.st-已確認{background:var(--soft);color:var(--main-d)}
.st-已取消,.st-已婉拒{background:#eee;color:#888}.st-已完成{background:#e1ecf7;color:#2f5f8f}.st-未到{background:#fbe2dd;color:#a1452f}
.cancel{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font-size:13px;color:var(--warn);white-space:nowrap}
.cancel.sure{background:var(--warn);color:#fff;border-color:var(--warn)}
.done{text-align:center;padding:26px 8px}.done .ic{font-size:50px}.done h2{margin:6px 0}
/* 試算表 */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#f3ead8;text-align:left;padding:7px 6px;font-weight:700;white-space:nowrap}
.tbl td{border-top:1px solid var(--line);padding:7px 6px;vertical-align:middle}
.tbl tr.clash td{background:#fde2e1}
.tbl tr.past td{opacity:.55}
.tbl select{border:1px solid var(--line);border-radius:6px;padding:3px;background:#fff;font-size:13px}
.scroll{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .full{grid-column:1/-1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week .col{background:#faf6ef;border-radius:8px;padding:5px 3px;text-align:center;min-height:60px}
.week .col b{display:block;font-size:13px;margin-bottom:3px}
.slot{display:block;width:100%;border:0;border-radius:6px;background:var(--soft);color:var(--main-d);font-size:12px;padding:3px 0;margin:3px 0}
.addslot{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.addslot select,.addslot input{border:1.5px solid var(--line);border-radius:8px;padding:7px;background:#fff}
.set{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);gap:10px}
.set:first-of-type{border-top:0}
.set input,.set select{width:110px;border:1.5px solid var(--line);border-radius:8px;padding:6px;background:#fff;text-align:right}
.log{font-size:12px;max-height:340px;overflow-y:auto}
.log div{border-top:1px dashed var(--line);padding:5px 0}
.log span{color:var(--mute);margin-right:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#3d3a35;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:90%;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:opacity .3s}
.guide ol{margin:0;padding-left:20px}.guide li{margin:5px 0}
.hide{display:none!important}

/* 時段表（像電影院劃位：綠=可預約、紅=已被預約、灰=未開放） */
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sec{margin-top:10px}
.sec:first-of-type{margin-top:0}
.sec .sn{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px}
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sl{border:0;border-radius:9px;padding:7px 0 6px;font-size:14px;font-weight:700;line-height:1.2}
.sl small{display:block;font-size:10px;font-weight:400;opacity:.85}
.delb{border:0;background:none;font-size:16px;padding:4px 6px;opacity:.6}.delb:active{opacity:1}
.sl.ok{background:#3f9d5d;color:#fff}
.sl.ok.on{background:#1f6b3a;box-shadow:0 0 0 3px #bfe3c9}
.sl.busy{background:#d9443a;color:#fff;opacity:.88}
.sl.no{background:#dcd8d2;color:#8c867d}
.sl.no.on{background:#8c867d;color:#fff;box-shadow:0 0 0 3px #e6e2db}
.durs{display:flex;gap:7px}
.durs button{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 0;background:#fff}
.durs button.on{border-color:var(--main);background:var(--soft);color:var(--main-d);font-weight:700}
.date.full{opacity:.45}
.date .cnt{font-size:10px;color:#2c7a47;display:block}
.date.full .cnt{color:#8c867d}
/* 諮商師開放時段 */
.blk{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.bk2{border:2px solid #dcd8d2;border-radius:11px;padding:9px 4px;background:#ecebe8;text-align:center;font-size:14px}
.bk2 b{display:block;font-size:15px}
.bk2 small{display:block;font-size:11px;color:var(--mute);min-height:15px}
.bk2.open{border-color:#3f9d5d;background:#e3f3e8}
.bk2.open small{color:#2c7a47;font-weight:700}
.bk2.has{border-color:#d9443a;background:#fde8e6}
.bk2.has small{color:#a1271e}
.rowbtn{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.rowbtn .btn{flex:1}
.date .od{font-size:10px;color:var(--main-d);display:block}

.cf .acv{display:flex;flex-direction:column;border-top:1px solid #eee}
.cf .acv button{border:0;border-top:1px solid #eee;background:#fff;padding:10px;color:#2a6fd6;font-weight:700;font-size:14px}
.cf .acv button:first-child{border-top:0}
.cf .acv button:disabled{color:#bbb}

.sl.orig{background:#f3c76b;color:#6b4a00}

/* 預約表（週表）／清冊 */
#pbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--main);z-index:999;opacity:0;pointer-events:none}
.stale{font-size:13px;color:var(--main-d);background:#fff;border-radius:10px;padding:8px 12px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.stale .spin{width:14px;height:14px;border-width:2px;margin:0}
.live{font-size:12px;color:var(--main-d);margin:-2px 0 10px;display:flex;align-items:center;gap:6px}
.ldot{width:8px;height:8px;border-radius:50%;background:#3cb371;box-shadow:0 0 0 3px #d6f0de;animation:lp 1.6s infinite}
@keyframes lp{50%{opacity:.4}}
.wknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wknav b{flex:1;text-align:center}
.wkday h3{display:flex;align-items:center;gap:6px}
.wkday.today{box-shadow:0 0 0 2px var(--gold)}
.wksecs{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.wksecs{grid-template-columns:1fr 1fr}}
.ftbl{width:100%;border-collapse:collapse;font-size:13px;border:1.5px solid #3d3a35}
.ftbl th{background:#fff35c;padding:5px 4px;font-weight:700;border:1px solid #3d3a35;font-size:12px;line-height:1.2}
.ftbl td{border:1px solid #bdb5a6;padding:5px;vertical-align:middle}
.ftbl td.tl{text-align:center;font-weight:700}
.ftbl td.c{width:56px;text-align:center}
.ftbl th:nth-child(3),.ftbl th:nth-child(4){width:56px}
.ftbl td.c>div{min-height:22px}
.ftbl tr.closed td{background:#f1eee8}
.dn{border:1px solid var(--main);background:#fff;color:var(--main-d);border-radius:14px;padding:3px 6px;font-size:12px;font-family:inherit;line-height:1.2;white-space:nowrap}
.dn.on{background:var(--main);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.acts .dn{font-size:13px;padding:5px 11px;border-radius:16px}
.dn.pri{background:var(--gold,#d9a441);border-color:var(--gold,#d9a441);color:#fff;font-weight:700}
.ftbl td.who-c{padding:8px 8px}
.ftbl input[type=checkbox]{width:18px;height:18px}
.who{margin:2px 0}
.who.leave b{text-decoration:line-through;color:#a1452f}
.who.cont{color:var(--mute);font-size:12px}
.pill{display:inline-block;font-size:10px;border-radius:8px;padding:1px 6px;margin:2px 3px 0 0}
.pill.red{background:#fbe2dd;color:#a1452f}
.pill.gold{background:#fbf1dc;color:#8a5a00}
.pill.done{background:#e1ecf7;color:#2f5f8f}
.ftbl td.tl{width:58px;padding:6px 2px;font-size:15px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:.2px;white-space:nowrap}
.ftbl td.tl i{display:block;font-style:normal;color:#9a948a;font-size:12px;line-height:1}
.who.tapme{cursor:pointer}
.who .mini{margin-top:2px;font-size:13px}
.dtbox{max-height:90vh;overflow-y:auto}
.dtbox .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.dtbox .row span:first-child{color:#8a847a;white-space:nowrap}
.dtbox .acts{margin:12px 0 4px}
.pr{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px;margin:2px 3px 0 0;white-space:nowrap}
.pr.p0{background:#dff1e3;color:#2e7d43}.pr.p1{background:#dde9fb;color:#2459a8}.pr.p2{background:#fde6d2;color:#b4560f}.pr.p3{background:#ece2f7;color:#6b3fa0}
.pr.none{background:#eee;color:#888;font-weight:400}
.ptap{cursor:pointer;border-bottom:1px dashed var(--main)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheetbox{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:18px 16px 24px;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.sheetbox h3{margin:0 0 4px}.sheetbox .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.sheetbox .opts button{padding:12px 6px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:700}
.sheetbox .opts button.on{border-color:var(--main);background:#fff0f2}
.sheetbox label.rd{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.stats div{background:#fff;border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--mute)}
.stats b{display:block;font-size:19px;color:var(--ink)}
.tbl tr.dead td{color:#aaa;text-decoration:line-through}
.tbl td.c{text-align:center}

header.top2{background:var(--main);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 14px}
header.top2 h1{margin:0;font-size:20px;letter-spacing:1px}
header.top2 p{margin:3px 0 0;font-size:13px;opacity:.9}
#app{padding:12px;max-width:820px;margin:0 auto}
.toast{white-space:pre-line}
.loading{text-align:center;color:var(--mute);padding:60px 0}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--main);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}


/* ===== 美化：粉圓字體、柔和暖色、診所 LOGO ===== */
:root{--bg:#fff;--card:#fff;--ink:#4a3f3a;--mute:#9a8c80;--line:#f4dde0;--main:#ee7388;--main-d:#cf4d66;--soft:#fff0f2;--warn:#e0604f;--gold:#e8a93b;--heart:#e5584a}
body{font-family:"Huninn","jf-openhuninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
b,strong,h1,h2,h3,button,th{font-synthesis:weight}
header.top2{display:flex;align-items:center;gap:16px;background:#e0707f;padding:calc(18px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 28px 28px;box-shadow:0 4px 14px rgba(224,112,127,.28);position:relative;overflow:hidden}
header.top2::after{content:"";position:absolute;right:-26px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.13)}
header.top2::before{content:"";position:absolute;right:58px;bottom:14px;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.3);box-shadow:-46px -26px 0 -3px rgba(255,255,255,.22),38px -34px 0 -4px rgba(255,255,255,.25),84px 4px 0 -5px rgba(255,255,255,.2)}
header.top2 .logo{width:58px;height:58px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 0 0 7px rgba(255,255,255,.22);margin:0 3px 0 6px;flex:none;object-fit:contain;position:relative;z-index:1}
header.top2 h1{font-size:22px;letter-spacing:2px;position:relative;z-index:1}
header.top2 p{font-size:13px;letter-spacing:1px;opacity:.95;position:relative;z-index:1}
.card{border-radius:18px;box-shadow:0 2px 12px rgba(230,120,140,.12);border:1px solid #fbe6e9}
.chip{border-radius:22px;padding:6px 14px;border-color:#f4dde0}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
.ltabs{border-radius:16px;border-color:#f4dde0;box-shadow:0 1px 6px rgba(230,120,140,.1)}
.ltabs button.on{background:var(--main);color:#fff}
.date{border-radius:16px;border-color:#f4dde0}
.date.on{background:var(--soft);border-color:var(--main);box-shadow:0 0 0 2px rgba(238,115,136,.25)}
.durs button,.radios button{border-radius:14px}
.btn{border-radius:16px;box-shadow:0 3px 0 rgba(207,77,102,.4);padding:14px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(207,77,102,.4)}
.btn.ghost{box-shadow:none}
.sl{border-radius:12px}
.bk2{border-radius:14px}
.f{border-radius:14px}
.step{font-size:14px;letter-spacing:.5px}
.tbl th{background:#ffe98a;color:#5b4a16}
.badge{border-radius:12px}
</style>
</head>
<body>
<header class="top2"><img class="logo" src="logo.png" alt="GodLove"><div><h1 id="title">主愛心理諮商</h1><p id="sub">線上預約</p></div></header>
<div id="pbar"></div><main id="app"><div class="loading"><div class="spin"></div>載入中…</div></main>
<div class="toast hide" id="toast"></div>
<script>
/* ===== 設定：部署前請填好這兩個值 ===== */
const CONFIG = {
  LIFF_ID: '2012537637-gKDcad31',
  API_URL: 'https://script.google.com/macros/s/AKfycbzwUyrhUd_mf47BmhbaSHuGTC1F9SdZPOXflgwMqGpw_Xp4p326co8b6vPWJCYUQ44zKw/exec'
};
/* ===================================== */
// 先叫後台醒來（暖機）：和 LINE 登入同時進行，省下後台冷啟動的等待
try { fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'ping' }) }).catch(function () { }); } catch (e) { }

const WD = ['日', '一', '二', '三', '四', '五', '六'];
const ACTIVE = ['待確認', '已確認'];
const SHOWN = ['待確認', '已確認', '當日請假', '已完成', '未到'];
const STATUS = ['待確認', '已確認', '已取消', '已婉拒', '當日請假', '已完成', '未到'];
const ST_OPT = [['已確認', '預約'], ['已取消', '取消'], ['未到', '未到'], ['已完成', '完成']];
const stGroup = s => ({ '待確認': '已確認', '已確認': '已確認', '已取消': '已取消', '已婉拒': '已取消', '當日請假': '未到', '未到': '未到', '已完成': '已完成' }[s] || s);
const stLabel = s => (ST_OPT.find(o => o[0] === stGroup(s)) || [0, s])[1];
const SECTIONS = [{ n: '上午', h: [10, 11, 12] }, { n: '下午', h: [14, 15, 16] }, { n: '晚上', h: [18, 19, 20] }];

let D = null, idToken = '', profileName = '', clockOff = 0, busyReq = false, STALE = false;
// 先顯示手機記住的上次畫面，背景再抓最新資料
let freshRes; const freshP = new Promise(r => freshRes = r);
const CKEY = 'gl_booking_cache_v1';
function saveCache() { try { localStorage.setItem(CKEY, JSON.stringify({ at: Date.now(), off: clockOff, D })); } catch (e) { } }
function showCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CKEY) || 'null');
    if (!c || !c.D || Date.now() - c.at > 7 * 864e5) return false;
    D = c.D; clockOff = c.off || 0; STALE = true;
    document.getElementById('title').textContent = D.set.name;
    render();
    return true;
  } catch (e) { return false; }
}
const $app = () => document.getElementById('app');

/* ---------- 時間工具（台灣時間） ---------- */
const nowMs = () => Date.now() + clockOff;
const pad = n => ('0' + n).slice(-2);
const slotT = (d, t) => Date.parse(d + 'T' + t + ':00+08:00');
const TP = t => new Date(t + 8 * 3600e3);
const dstr = t => { const x = TP(t); return x.getUTCFullYear() + '-' + pad(x.getUTCMonth() + 1) + '-' + pad(x.getUTCDate()); };
const today = () => dstr(nowMs());
const addDays = (d, n) => dstr(slotT(d, '12:00') + n * 864e5);
const wdOf = d => WD[new Date(slotT(d, '12:00')).getUTCDay()];
const md = d => { const p = d.split('-'); return Number(p[1]) + '/' + Number(p[2]); };
const toMin = t => { const p = t.split(':'); return +p[0] * 60 + +p[1]; };
const m2t = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const durTxt = m => (m % 60 ? (m / 60).toFixed(1) : m / 60) + ' 小時';
const endOf = b => m2t(toMin(b.time) + b.dur);
const rng = b => b.time + '～' + endOf(b);
const whenTxt = b => md(b.date) + '（' + wdOf(b.date) + '）' + rng(b);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byDT = (a, b) => (a.date + a.time) < (b.date + b.time) ? -1 : 1;

/* ---------- 時段規則（與後端相同） ---------- */
const bizH = d => (D.biz[wdOf(d)] || []);
const daySections = d => SECTIONS.map(s => ({ n: s.n, h: s.h.filter(h => bizH(d).includes(h)) })).filter(s => s.h.length);
const sectionStarts = sec => { const a = sec.h[0] * 60, e = (sec.h[sec.h.length - 1] + 1) * 60, r = []; for (let m = a; m + 60 <= e; m += 30) r.push(m); return r; };
const isOpenCell = (d, m) => (D.open[d] || []).includes(Math.floor(m / 60));
function busyList(ign) {
  if (isStaff()) return D.books.filter(b => ACTIVE.includes(b.status) && b.id !== ign).concat(D.holds.map(h => ({ date: h.date, time: h.time, dur: +h.dur, hold: true })));
  return D.busy.concat(D.mine.filter(b => ACTIVE.includes(b.status) && b.id !== ign));
}
const busyAt = (d, m, ign) => busyList(ign).find(x => x.date === d && m >= toMin(x.time) && m < toMin(x.time) + +x.dur);
function slotState(d, s, dur, ign) {
  const t = today();
  if (d < t || (d === t && !D.set.sameDay) || slotT(d, m2t(s)) <= nowMs()) return 'past';
  for (let m = s; m < s + dur; m += 30) { if (!isOpenCell(d, m)) return 'closed'; if (busyAt(d, m, ign)) return 'busy'; }
  return 'ok';
}
function nextDays(n, from) { const a = []; for (let i = 0; i <= n; i++) { const d = addDays(from || today(), i); if (bizH(d).length) a.push(d); } return a; }
const bookDates = () => nextDays(D.set.days).filter(d => (d > today() || (d === today() && D.set.sameDay)) && (D.open[d] || []).some(h => slotT(d, m2t(h * 60)) > nowMs()));
const okCount = (d, dur, ign) => { let n = 0; daySections(d).forEach(s => sectionStarts(s).forEach(m => { if (slotState(d, m, dur, ign) === 'ok') n++; })); return n; };
const durOptions = () => { const a = []; for (let m = 60; m <= D.set.maxDur; m += 30) a.push(m); return a; };
const canChange = b => today() < b.date;
const canLeave = b => b.date === today() && nowMs() < slotT(b.date, endOf(b));
const finishAt = b => slotT(b.date, b.time) + b.dur * 30000;   // 諮商進行到一半才開放
const canFinish = b => (b.status === '已確認' || b.status === '待確認') && b.date === today() && nowMs() >= finishAt(b);
const finishWait = b => (b.status === '已確認' || b.status === '待確認') && b.date === today() && nowMs() < finishAt(b);
const isStaff = () => D && ['諮商師', '診所', '代班'].includes(D.role);
const canEdit = () => D && ['諮商師', '診所'].includes(D.role);

/* ---------- 連線 ---------- */
let pendingN = 0;
function bar(on) {
  const e = document.getElementById('pbar'); if (!e) return;
  if (on) { e.style.transition = 'none'; e.style.width = '0'; e.style.opacity = '1'; void e.offsetWidth; e.style.transition = 'width 8s cubic-bezier(.1,.8,.3,1)'; e.style.width = '85%'; }
  else { e.style.transition = 'width .2s'; e.style.width = '100%'; setTimeout(() => { if (!pendingN) e.style.opacity = '0'; }, 250); }
}
async function api(action, extra) {
  if (action !== 'init') await freshP;
  const mut = action !== 'init';
  if (mut && ++pendingN === 1) bar(true);
  try {
    const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, idToken, displayName: profileName }, extra || {})) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '發生錯誤，請稍後再試');
    return j;
  } finally { if (mut && --pendingN === 0) bar(false); }
}
async function load(pre) {
  const y = window.scrollY, wasStale = STALE;
  D = (pre && pre.ok) ? pre : await api('init');
  lastLoad = Date.now();
  clockOff = D.now - Date.now();
  STALE = false;
  saveCache();
  document.getElementById('title').textContent = D.set.name;
  render();
  if (wasStale) window.scrollTo(0, y);
  freshRes();
}
async function act(fn, okMsg) {
  if (busyReq) return;
  busyReq = true; toast('處理中…');
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg); await load(r && r.state); return r; }
  catch (e) { toast(e.message); }
  finally { busyReq = false; }
}
/* 自動更新：工作人員停在「預約表」時，每 30 秒、或切回畫面時，安靜地抓最新資料 */
let lastLoad = 0;
async function autoRefresh() {
  if (busyReq || document.hidden || !D || !isStaff() || stab !== 'sheet' || Object.keys(openDirty).length) return;
  if (Date.now() - lastLoad < 25000) return;
  busyReq = true;
  const y = window.scrollY;
  try { await load(); window.scrollTo(0, y); } catch (e) { }
  finally { busyReq = false; }
}
setInterval(autoRefresh, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) autoRefresh(); });
async function say(text) { try { if (window.liff && liff.isInClient()) await liff.sendMessages([{ type: 'text', text }]); } catch (e) { } }

let toastT;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.remove('hide'); t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.classList.add('hide'), 300); }, 3000); }

async function main() {
  const cached = showCache();
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    idToken = liff.getIDToken();
    try { profileName = localStorage.getItem('gl_pn') || ''; } catch (e) { }
    liff.getProfile().then(function (p) {            // 暱稱在背景取得，不擋住畫面
      profileName = p.displayName || profileName;
      try { localStorage.setItem('gl_pn', profileName); } catch (e) { }
      if (typeof L !== 'undefined' && L.fd && !L.fd.name) L.fd.name = profileName;
    }).catch(function () { });
    await load();
  } catch (e) {
    freshRes();
    const msg = '<div class="card"><div class="err">' + esc(e.message || '無法開啟') + '</div>請關閉後從 LINE 官方帳號重新開啟。</div>';
    if (cached) $app().insertAdjacentHTML('afterbegin', msg); else $app().innerHTML = msg;
  }
}

/* ================= 畫面 ================= */
function render() {
  // 重畫畫面時，記住日期列／表格的橫向捲動位置，避免跳回最前面
  const keep = [...document.querySelectorAll('.dates, .scroll')].map(e => e.scrollLeft);
  document.getElementById('sub').textContent = isStaff() ? (D.role === '代班' ? '今日代班｜預約表' : D.role + '｜預約管理') : '線上預約';
  $app().innerHTML = (STALE ? '<div class="stale"><div class="spin"></div>正在更新最新資料…</div>' : '') + (isStaff() ? renderStaff() : renderClient());
  document.querySelectorAll('.dates, .scroll').forEach((e, i) => { if (keep[i]) e.scrollLeft = keep[i]; });
  if (typeof DT !== 'undefined' && DT) drawDT();
}

/* ================= 個案 ================= */
const L = { tab: 'book', date: null, start: null, dur: 60, fd: null, err: '', done: null, sure: {}, resched: null, leave: null, reason: '', next: false };

function renderClient() {
  if (!L.fd) L.fd = { name: D.me.name || profileName || '', note: '' };
  let h = '';
  if (L.done) {
    return '<div class="card done"><div class="ic">' + L.done.ic + '</div><h2>' + L.done.title + '</h2><p class="hint">' + L.done.sub + '</p>' +
      '<button class="btn" onclick="closeOrBack()">關閉</button></div>';
  }
  h += '<div class="ltabs"><button class="' + (L.tab === 'book' ? 'on' : '') + '" onclick="L.tab=\'book\';L.err=\'\';render()">預約時間表</button><button class="' + (L.tab === 'mine' ? 'on' : '') + '" onclick="L.tab=\'mine\';L.err=\'\';L.resched=null;render()">我的預約</button></div>';
  if (L.err) h += '<div class="err">' + esc(L.err) + '</div>';
  return h + (L.tab === 'book' ? renderBook() : renderMine());
}
function closeOrBack() {   // 先回到「我的預約」，再嘗試關閉視窗（關不掉時至少畫面有反應）
  L.done = null; L.tab = 'mine'; render(); scrollTo(0, 0);
  try { if (window.liff && liff.isInClient()) liff.closeWindow(); } catch (e) { }
}

const LEGEND = '<div class="legend"><span><i style="background:#3f9d5d"></i>可預約</span><span><i style="background:#d9443a"></i>已被預約</span><span><i style="background:#dcd8d2"></i>未開放</span></div>';
function renderBook() {
  let h = '';
  const rb = L.resched ? D.mine.find(b => b.id === L.resched) : null, ign = rb ? rb.id : null;
  if (rb) h += '<div class="card" style="background:#fbf1dc"><b>🔄 改期中</b><div class="hint" style="margin:4px 0 8px">原本：' + whenTxt(rb) + '<br>請選擇新的時段</div><button class="btn ghost sm" onclick="L.resched=null;L.tab=\'mine\';render()">不改了</button></div>';
  if (L.next) h += '<div class="card" style="background:#fff0f2"><b>✅ 本次諮商已完成</b><div class="hint" style="margin:4px 0 8px">請選擇下一次的時間，送出後就約好了。</div><button class="btn ghost sm" onclick="L.next=false;L.tab=\'mine\';render()">之後再約</button></div>';
  const myN = D.mine.filter(b => b.status === '待確認' || b.status === '已確認').length;
  if (!rb && myN >= (D.set.maxN || 1)) return h + '<div class="card" style="text-align:center"><b>您已經有一筆預約了</b><div class="hint" style="margin:6px 0 10px">為了讓更多人都能預約到時段，每人同時只能預約 ' + (D.set.maxN || 1) + ' 次。<br>要換時間請到「我的預約」按「改期」。</div><button class="btn" onclick="L.tab=\'mine\';render()">看我的預約</button></div>';
  const ds = bookDates();
  if (!ds.length) return h + '<div class="card hint" style="text-align:center">目前沒有開放預約的時段</div>';
  if (!durOptions().includes(L.dur)) L.dur = 60;
  if (!L.date || !ds.includes(L.date)) L.date = ds.find(d => okCount(d, L.dur, ign)) || ds[0];
  if (L.start != null && slotState(L.date, L.start, L.dur, ign) !== 'ok') L.start = null;
  h += '<div class="card"><p class="step">① 選擇日期</p><div class="dates">' + ds.map(d => {
    const n = okCount(d, L.dur, ign);
    return '<button class="date ' + (d === L.date ? 'on' : '') + (n ? '' : ' full') + '" onclick="L.date=\'' + d + '\';L.start=null;L.err=\'\';render()"><small>週' + wdOf(d) + '</small><b>' + md(d) + '</b><span class="cnt">' + (n ? '可約' : '額滿') + '</span></button>';
  }).join('') + '</div></div>';
  const multi = durOptions().length > 1;
  if (multi) h += '<div class="card"><p class="step">② 預約多久</p><div class="durs">' + durOptions().map(m => '<button class="' + (L.dur === m ? 'on' : '') + '" onclick="L.dur=' + m + ';render()">' + durTxt(m) + '</button>').join('') + '</div></div>';
  h += '<div class="card"><p class="step">' + (multi ? '③' : '②') + ' 選擇開始時間</p>' + LEGEND + '';
  daySections(L.date).forEach(sec => {
    h += '<div class="sec"><div class="sn">' + sec.n + '</div><div class="sgrid">';
    sectionStarts(sec).forEach(m => {
      const st = slotState(L.date, m, L.dur, ign), ok = st === 'ok';
      h += '<button class="sl ' + (ok ? 'ok' : st === 'busy' ? 'busy' : 'no') + (L.start === m ? ' on' : '') + '" ' + (ok ? 'onclick="L.start=' + m + ';L.err=\'\';render()"' : 'disabled') + '>' + m2t(m) + '<small>～' + m2t(m + L.dur) + '</small></button>';
    });
    h += '</div></div>';
  });
  h += '</div>';
  if (!rb) {
    h += '<div class="card"><p class="step">' + (multi ? '④' : '③') + ' 填寫資料</p><label>姓名</label><input class="f" value="' + esc(L.fd.name) + '" oninput="L.fd.name=this.value" placeholder="您的姓名" maxlength="30">' +
      '<label>備註（選填）</label><textarea class="f" rows="2" oninput="L.fd.note=this.value" maxlength="100" placeholder="例如：需要無障礙空間">' + esc(L.fd.note) + '</textarea>' +
      '<p class="hint">為保護您的隱私，請不要在這裡填寫個人狀況或病史。</p></div>';
  }
  const ready = L.start != null;
  h += '<div class="card">' + (ready ? '<div class="summary">' + (rb ? '新時間：' : '') + md(L.date) + '（週' + wdOf(L.date) + '）' + m2t(L.start) + '～' + m2t(L.start + L.dur) + '（' + durTxt(L.dur) + '）</div>' : '') +
    '<button class="btn" ' + (ready && !busyReq ? '' : 'disabled') + ' onclick="' + (rb ? 'doResched()' : 'doBook()') + '">' + (ready ? (rb ? '確定改到這個時段' : '送出預約') : '請先選擇綠色的時段') + '</button>' +
    '<p class="hint" style="text-align:center">預約日前一天以前可以取消或改期；<br>若當天才通知請假或改期，將會另外酌收 ' + D.set.fee + ' 元</p></div>';
  return h;
}

function renderMine() {
  let h = '';
  if (!D.mine.length) h += '<div class="card hint" style="text-align:center">您目前沒有預約</div>';
  D.mine.forEach(b => {
    h += '<div class="card"><div class="bk"><div class="info"><b>' + whenTxt(b) + '</b><span class="badge st-' + b.status + '">' + b.status + '</span><div class="hint">' + durTxt(b.dur) + '</div></div></div>';
    if (b.offer) h += '<p class="hint" style="margin:8px 0 0;color:#a67a1f">⏰ ' + esc(D.set.who) + '需要調整這個時間，請到 LINE 訊息選擇新時間</p>';
    if (b.status === '已完成') {
      const has = D.mine.some(x => x.id !== b.id && ACTIVE.includes(x.status));
      h += has ? '<p class="hint" style="margin:8px 0 0">本次諮商已完成，您已預約好下一次。</p>' : '<div style="margin-top:10px"><button class="btn" style="width:100%" onclick="startNext(\'' + b.id + '\')">約下一次</button></div>';
      h += '</div>'; return;
    }
    if (b.status === '當日請假') h += '<p class="hint" style="margin:8px 0 0">已請假，原因：' + esc(b.leaveReason) + '</p>';
    else if (canChange(b)) {
      h += '<div class="rowbtn"><button class="btn ghost sm" onclick="startResched(\'' + b.id + '\')">改期</button>' +
        '<button class="cancel ' + (L.sure[b.id] ? 'sure' : '') + '" style="flex:1" onclick="doCancel(\'' + b.id + '\')">' + (L.sure[b.id] ? '確定取消？' : '取消預約') + '</button></div>';
    } else if (canLeave(b) && !canFinish(b)) {
      if (L.leave === b.id) {
        h += '<div style="margin-top:10px"><label>請假原因（必填）</label><textarea class="f" rows="2" maxlength="100" oninput="L.reason=this.value" placeholder="請簡單說明原因">' + esc(L.reason) + '</textarea>' +
          '<p class="hint">若當天才通知請假或改期，將會另外酌收 ' + D.set.fee + ' 元。</p>' +
          '<div class="rowbtn"><button class="btn ghost sm" onclick="L.leave=null;render()">先不要</button><button class="btn sm" onclick="doLeave(\'' + b.id + '\')">送出請假</button></div></div>';
      } else {
        h += '<p class="hint" style="margin:8px 0">今天是預約當天，無法取消或改期，如無法前來請按「請假」。</p><button class="btn ghost sm" style="width:100%" onclick="L.leave=\'' + b.id + '\';L.reason=\'\';render()">請假</button>';
      }
    }
    if (finishWait(b)) h += '<p class="hint" style="margin:10px 0 0">🔒 諮商進行到一半（' + m2t(Math.round((finishAt(b) - slotT(b.date, '00:00')) / 60000)) + '）之後，這裡會出現「約下一次」按鈕。</p>';
    if (canFinish(b)) {
      h += '<div style="margin-top:10px"><button class="btn" style="width:100%" onclick="doFinish(\'' + b.id + '\')">' + (L.sure['f' + b.id] ? '確定本次已完成？再按一次，開始選下一次' : '✅ 本次諮商完成，約下一次') + '</button><p class="hint" style="margin:6px 0 0">按下後這次會標示為「已完成」，接著選擇下一次的時間。</p></div>';
    }
    h += '</div>';
  });
  h += '<p class="hint" style="text-align:center">預約日前一天以前可以自行取消或改期；<br>若當天才通知請假或改期，將會另外酌收 ' + D.set.fee + ' 元。</p>';

/* ---- 預約表（週表）與清冊 ---- */
function weekDays(off) {
  const t = slotT(today(), '12:00'), w = new Date(t).getUTCDay() || 7, mon = t - (w - 1) * 864e5 + off * 7 * 864e5, a = [];
  for (let i = 0; i < 5; i++) a.push(dstr(mon + i * 864e5));
  return a;
}
const pad2 = n => String(n).padStart(2, '0');
const tlLabel = h => pad2(h) + ':00<i>│</i>' + pad2(h + 1) + ':00';

/* 頁面內的確認視窗（瀏覽器內建的 confirm 在 LINE 或預覽視窗裡可能被擋掉，按了會完全沒反應） */

function renderWeek() {

  days.forEach(d => { h += dayCard(d); });
  return h;
}
function renderToday() {
  const d = today();
  if (!daySections(d).length) return '<div class="card"><h3>今天 ' + md(d) + '（' + wdOf(d) + '）</h3><div class="hint">今天休診</div></div>';

}
function dayCard(d, extra) {
  let h = '';
  {
    h += '<div class="card wkday' + (d === today() ? ' today' : '') + '"><h3>' + md(d) + '（' + wdOf(d) + '）' + (d === today() ? '<span class="pill gold">今天</span>' : '') + (extra || '') + '</h3><div class="wksecs">';

    secs.forEach(sec => {
      h += '<table class="ftbl"><tr><th>時段</th><th>個案</th></tr>';

        const a = hr * 60, e = a + 60;
        const list = D.books.filter(b => b.date === d && SHOWN.includes(b.status) && toMin(b.time) < e && toMin(b.time) + b.dur > a).sort(byDT);
        const blk = D.holds.filter(x => x.date === d && toMin(x.time) < e && toMin(x.time) + +x.dur > a);
        const open = (D.open[d] || []).includes(hr);
        let who = '';
        list.forEach(b => {
          const leave = b.status === '當日請假';
          if (toMin(b.time) >= a) {
            const tm = (toMin(b.time) % 60 || b.dur !== 60) ? ' <span class="hint">' + rng(b) + '</span>' : '';
            who += '<div class="who' + (leave ? ' leave' : '') + (canEdit() ? ' tapme' : '') + '"' + (canEdit() ? ' onclick="openDT(\'' + b.id + '\')"' : '') + '><b>' + esc(b.name) + '</b>' + tm + '<div class="mini">' + contactOf(b) + ' ' + priceBadge(b) + '</div>' + gridNote(b) + '</div>';
          } else who += '<div class="who cont">↳ ' + esc(b.name) + '（續到 ' + endOf(b) + '）</div>';
        });

      });
      h += '</table>';
    });
    h += '</div></div>';
  }
  return h;

function renderRoster() {

  const cnt = { n: act2.length, leave: list.filter(b => b.status === '當日請假').length, cancel: list.filter(b => b.status === '已取消' || b.status === '已婉拒').length, extra: list.filter(b => b.extra && SHOWN.includes(b.status)).length, done: act2.filter(b => b.status === '已完成').length };
  const rg = [['today', '今天'], ['week', '本週'], ['month', '本月'], ['all', '全部']];
  let h = '<div class="chips">' + rg.map(([k, l]) => '<button class="chip ' + (shRange === k ? 'on' : '') + '" onclick="shRange=\'' + k + '\';render()">' + l + '</button>').join('') + '</div>';
  h += '<div class="stats"><div><b>' + cnt.n + '</b>預約</div><div><b>' + cnt.leave + '</b>臨時取消</div><div><b>' + cnt.cancel + '</b>已取消</div><div><b>' + cnt.extra + '</b>需加收</div><div><b>' + cnt.done + '/' + cnt.n + '</b>已完成</div></div>';
  h += '<div class="card"><div class="scroll"><table class="tbl"><tr><th>日期</th><th>時間</th><th>姓名</th><th>聯絡</th><th>狀態</th><th>臨時取消</th><th>加收</th><th>異動紀錄</th><th>最後更新</th>' + (canEdit() ? '<th></th>' : '') + '</tr>';
  if (!list.length) h += '<tr><td colspan="10" class="hint" style="text-align:center;padding:16px">這段期間沒有預約</td></tr>';
  list.forEach(b => {
    const dead = b.status === '已取消' || b.status === '已婉拒';
    const hist = [b.history ? '改期：' + b.history : '', b.leaveReason ? '請假：' + b.leaveReason : '', b.note].filter(Boolean).join('；');
    const st = canEdit() ? '<select onchange="setStatus(\'' + b.id + '\',this.value)">' + (b.status === '待確認' ? '<option selected value="待確認">待確認</option>' : '') + ST_OPT.map(o => '<option value="' + o[0] + '"' + (o[0] === stGroup(b.status) && b.status !== '待確認' ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>' : '<span class="badge st-' + b.status + '">' + stLabel(b.status) + '</span>';
    h += '<tr class="' + (dead ? 'dead' : '') + '"><td>' + md(b.date) + '（' + wdOf(b.date) + '）</td><td>' + rng(b) + '</td><td style="white-space:nowrap">' + nameTap(b) + '<br>' + priceBadge(b) + '</td><td>' + contactOf(b) + '</td><td>' + st + '</td>' +
      '<td class="c">' + (b.status === '當日請假' ? '✔ ' + esc(b.fee || '') : '') + '</td><td style="color:#c0392b">' + esc(b.extra || '') + '</td>' +
      '<td class="hint">' + esc(hist) + '</td><td class="hint" style="white-space:nowrap">' + esc(b.updated || '') + '</td>' + (canEdit() ? '<td class="c"><button class="delb" onclick="delBook(\'' + b.id + '\')" title="刪除這筆預約">🗑</button></td>' : '') + '</tr>';
  });
  h += '</table></div><p class="hint">預約、改期、取消、請假、加收都會自動更新到這裡。' + (canEdit() ? '改「狀態」會自動通知有 LINE 的個案；改成「當日請假」會請諮商師決定是否收費。' : '') + '</p></div>';
  return h;
}
async function delBook(id) {
  const b = D.books.find(x => x.id === id); if (!b) return;
  const msg = b.name + '　' + md(b.date) + '（' + wdOf(b.date) + '）' + rng(b) + '\n\n刪除後清冊就看不到，無法復原，也不會通知個案。';
  if (!await askBox('確定要刪除這筆預約嗎？', msg, [['刪除', '', 'y'], ['先不要', 'ghost', '']])) return;
  act(() => api('delBook', { id }), () => '已刪除');
}
async function setStatus(id, st) {
  let reason = '';
  if (st === '當日請假') { reason = '櫃檯登記'; }
  act(() => api('setStatus', { id, status: st, reason }), r => r.viaLine === false && ['已確認', '已取消', '已婉拒'].includes(st) ? '這位個案沒有 LINE，請另外通知' : '已更新');
}

/* ---- 開放時段 ---- */
function renderOpen() {
  const days = nextDays(D.set.days);
  if (!coDate || !days.includes(coDate)) coDate = days[1] || days[0];
  const cur = D.open[coDate] || [];
  let h = '<div class="card"><h3>選擇日期</h3><div class="dates">' + days.map(d => {
    const n = (D.open[d] || []).length;
    return '<button class="date ' + (d === coDate ? 'on' : '') + '" onclick="coDate=\'' + d + '\';render()"><small>週' + wdOf(d) + '</small><b>' + md(d) + '</b><span class="od">' + (n ? '開 ' + n + ' 小時' : '—') + '</span></button>';
  }).join('') + '</div></div>';
  h += '<div class="card"><h3>' + md(coDate) + '（週' + wdOf(coDate) + '）開放的時段</h3><p class="hint" style="margin-top:-4px">點一下切換「開放／不開放」，每格 1 小時。有人預約的時段不能關閉。</p>' + LEGEND;
  daySections(coDate).forEach(sec => {
    h += '<div class="sec"><div class="sn">' + sec.n + '</div><div class="blk">';
    sec.h.forEach(hr => {
      const on = cur.includes(hr);
      const bs = D.books.filter(b => ACTIVE.includes(b.status) && b.date === coDate && toMin(b.time) < (hr + 1) * 60 && toMin(b.time) + b.dur > hr * 60);
      const label = bs.length ? bs.map(b => esc(b.name) + ' ' + rng(b)).join('<br>') : (on ? '開放' : '不開放');
      h += '<button class="bk2 ' + (on ? 'open' : '') + (bs.length ? ' has' : '') + '" onclick="toggleHour(' + hr + ')"><b>' + hr + ':00</b><small>' + label + '</small></button>';
    });
    h += '</div></div>';
  });
  const holds = D.holds.filter(x => x.date === coDate);
  if (holds.length) h += '<div style="margin-top:12px"><div class="sn" style="font-size:13px;font-weight:700">諮商師保留（不開放預約）</div>' + holds.map(x => '<div class="set"><span>' + x.time + '～' + m2t(toMin(x.time) + +x.dur) + '　<span class="hint">' + esc(x.why) + '</span></span><button class="cancel" onclick="releaseHold(\'' + x.bid + '\')">解除</button></div>').join('') + '</div>';
  h += '<div class="rowbtn"><button class="btn ghost sm" onclick="setDay(true)">這天全部開放</button><button class="btn ghost sm" onclick="setDay(false)">這天全部關閉</button></div>' +
    '<div class="rowbtn"><button class="btn sm" onclick="copyWeeks()">把這天的設定套用到之後 4 週的星期' + wdOf(coDate) + '</button></div></div>';
  return h;
}
/* 開放／關閉時段：先在畫面上立刻變色，背景再送出（連續點很多格也不會漏） */
let openDirty = {}, openTimer = null;
function queueOpen(date, hours, msg) {
  D.open[date] = hours; openDirty[date] = hours;
  render(); if (msg) toast(msg);
  clearTimeout(openTimer); openTimer = setTimeout(flushOpen, 400);
}
async function flushOpen() {
  if (busyReq) { openTimer = setTimeout(flushOpen, 300); return; }
  const dirty = openDirty; openDirty = {}; busyReq = true;
  let last = null;
  try { for (const d in dirty) last = await api('setOpen', { date: d, hours: dirty[d] }); }
  catch (e) { toast(e.message); openDirty = {}; }
  finally { busyReq = false; }
  if (Object.keys(openDirty).length) { openTimer = setTimeout(flushOpen, 100); return; }
  try { await load(last && last.state); } catch (e) { }
}
function toggleHour(hr) {
  const cur = (D.open[coDate] || []).slice(), i = cur.indexOf(hr);
  if (i >= 0) cur.splice(i, 1); else cur.push(hr);
  queueOpen(coDate, cur.sort((a, b) => a - b));
}
function setDay(all) {
  const keep = bizH(coDate).filter(hr => D.books.some(b => ACTIVE.includes(b.status) && b.date === coDate && toMin(b.time) < (hr + 1) * 60 && toMin(b.time) + b.dur > hr * 60));
  queueOpen(coDate, all ? bizH(coDate) : keep, all ? '已全部開放' : (keep.length ? '有預約的時段保留開放，其餘已關閉' : '已全部關閉'));
}
function copyWeeks() { act(() => api('copyWeeks', { date: coDate }), '已套用到之後 4 週的星期' + wdOf(coDate)); }
function releaseHold(bid) { act(() => api('release', { bid }), '已解除保留，這段時間重新開放'); }

/* ---- 預約清單＋請個案改時間 ---- */
function renderCoList() {
  const list = D.books.filter(b => ACTIVE.includes(b.status) && b.date >= today() && slotT(b.date, endOf(b)) > nowMs()).sort(byDT);
  if (!list.length) return '<div class="card hint" style="text-align:center">目前沒有預約</div>';
  let h = '';
  list.forEach(b => {
    h += '<div class="card"><div class="bk"><div class="info"><b>' + whenTxt(b) + '</b><div>' + nameTap(b) + ' ' + priceBadge(b) + (b.phone ? ' <span class="hint">' + esc(b.phone) + '</span>' : '') + (b.note ? '<span class="hint">　' + esc(b.note) + '</span>' : '') + '</div>' +
      (b.offer ? '<div class="hint" style="color:#a67a1f">⏳ 已請個案改時間，等待個案選擇</div>' : '') + '</div>' +
      (CO.id === b.id ? '' : '<div style="display:flex;gap:6px"><button class="btn sm" onclick="renewFrom(\'' + b.id + '\')">續約<br>下一次</button><button class="btn ghost sm" onclick="openCO(\'' + b.id + '\')">請個案<br>改時間</button></div>') + '</div>';
    if (CO.id === b.id) h += coEditor(b);
    h += '</div>';
  });
  return h;
}
function renewFrom(id) {
  closeDT();   // 續約：帶入這位個案的資料，預設下週同一天同一時段，直接到「電話預約」選時間
  const b = D.books.find(x => x.id === id); if (!b) return;
  const c = (D.clients || []).find(x => x.uid === b.uid) || {};
  AD = { start: toMin(b.time), dur: b.dur, uid: '', from: b.uid ? b.id : '', name: b.name || '', phone: b.phone || c.phone || '', price: b.price || c.price || '' };
  DK = addDays(b.date, 7); stab = 'add'; render(); scrollTo(0, 0); toast('已帶入 ' + (b.name || '') + ' 的資料，確認時間後按「新增預約」');
}
function openCO(id) { CO.id = id; CO.reason = ''; CO.opts = []; CO.d = null; render(); }
function optProblem(b, o) {
  const s0 = toMin(o.time);
  if (slotT(o.date, o.time) <= nowMs()) return '已過';
  if (o.date === b.date && o.time === b.time) return '原時段';
  for (let m = s0; m < s0 + b.dur; m += 30) {
    if (!bizH(o.date).includes(Math.floor(m / 60))) return '非營業';
    const x = busyAt(o.date, m, b.id); if (x) return x.hold ? '保留中' : '有預約';
  }
  return '';
}
const optTxt = (o, dur) => md(o.date) + '（' + wdOf(o.date) + '）' + o.time + '～' + m2t(toMin(o.time) + dur);
function coGrid(b, d) {
  let g = '';
  daySections(d).forEach(sec => {
    let cells = '';
    sectionStarts(sec).forEach(m => {
      const o = { date: d, time: m2t(m) }, isOrig = d === b.date && o.time === b.time, picked = CO.opts.some(x => x.date === d && x.time === o.time);
      const p = isOrig ? '原時段' : optProblem(b, o);
      let open = true; for (let x = m; x < m + b.dur; x += 30) if (!isOpenCell(d, x)) open = false;
      const cls = picked ? 'ok on' : isOrig ? 'orig' : (p === '有預約' || p === '保留中') ? 'busy' : (p || !open) ? 'no' : 'ok';
      cells += '<button class="sl ' + cls + '" ' + (p && !picked ? 'disabled' : 'onclick="coToggle(\'' + d + '\',\'' + o.time + '\')"') + '>' + m2t(m) + '<small>' + (p ? (p === '已過' || p === '非營業' ? '—' : p) : (!open ? '未開放' : '～' + m2t(m + b.dur))) + '</small></button>';
    });
    if (cells) g += '<div class="sec"><div class="sn">' + sec.n + '</div><div class="sgrid">' + cells + '</div></div>';
  });
  return g || '<div class="hint">這天沒有營業時段</div>';
}
function coToggle(d, t) {
  const i = CO.opts.findIndex(x => x.date === d && x.time === t);
  if (i >= 0) CO.opts.splice(i, 1);
  else { if (CO.opts.length >= 3) return toast('最多提供 3 個時段'); CO.opts.push({ date: d, time: t }); CO.opts.sort((x, y) => (x.date + x.time) < (y.date + y.time) ? -1 : 1); }
  render();
}
function coEditor(b) {
  const days = nextDays(D.set.days).filter(x => x !== b.date);
  if (!CO.d || !days.includes(CO.d)) CO.d = days.find(x => x > b.date) || days[0];
  return '<div style="margin-top:12px;border-top:1px dashed var(--line);padding-top:10px">' +
    '<label>原因（選填，會告訴個案）</label><input class="f" value="' + esc(CO.reason) + '" oninput="CO.reason=this.value" maxlength="40" placeholder="例如：臨時要開會">' +
    '<label>① 當天往前／往後（' + md(b.date) + '（' + wdOf(b.date) + '），點選時段）</label>' +
    '<div class="legend"><span><i style="background:#d9443a"></i>可選</span><span><i style="background:#8f1f18"></i>已選</span><span><i style="background:#f3c76b"></i>原時段</span><span><i style="background:#dcd8d2"></i>不可選</span></div>' + coGrid(b, b.date) +
    '<label>② 改到其他日期（選日期後點選時段）</label><select class="f" onchange="CO.d=this.value;render()">' + days.map(x => '<option value="' + x + '"' + (x === CO.d ? ' selected' : '') + '>' + md(x) + '（' + wdOf(x) + '）</option>').join('') + '</select>' +
    '<div style="margin-top:8px">' + coGrid(b, CO.d) + '</div>' +
    '<label>已選的時段（每段 ' + durTxt(b.dur) + '，最多 3 個）</label>' +
    (CO.opts.length ? CO.opts.map((o, i) => '<div class="set"><span>' + optTxt(o, b.dur) + '</span><button class="cancel" onclick="CO.opts.splice(' + i + ',1);render()">✕</button></div>').join('') : '<div class="hint">還沒有選</div>') +
    '<p class="hint">「未開放」是平常沒開放預約的時間，仍可以選。個案選好新時間或選擇另外再約後，原時段會先保留，系統會再問你要不要開放。不收 ' + D.set.fee + ' 元。</p>' +
    '<div class="rowbtn"><button class="btn ghost sm" onclick="CO.id=null;render()">取消</button><button class="btn sm" ' + (CO.opts.length ? '' : 'disabled') + ' onclick="sendOffer()">傳給個案選擇</button></div></div>';
}
async function sendOffer() {
  const r = await act(() => api('offer', { id: CO.id, opts: CO.opts, reason: CO.reason.trim() }), r => r.viaLine ? '已傳給個案，等待個案選擇（同時通知診所）' : '這位個案沒有 LINE，已通知診所，請電話聯絡');
  if (r) CO.id = null;
  render();
}

/* ---- 電話預約 ---- */
let AD = { start: null, dur: 60, uid: '', name: '', phone: '', price: '' };
function staffState(d, s, dur) {
  if (slotT(d, m2t(s)) <= nowMs()) return 'past';
  let closed = false;
  for (let m = s; m < s + dur; m += 30) { if (busyAt(d, m, null)) return 'busy'; if (!isOpenCell(d, m)) closed = true; }
  return closed ? 'closed' : 'ok';
}
function renderAdd() {
  const dd = nextDays(D.set.days); if (!DK || !dd.includes(DK)) DK = dd.find(d => d >= today()) || dd[0];
  const durs = []; for (let m = 60; m <= Math.max(120, D.set.maxDur); m += 30) durs.push(m);
  if (!durs.includes(AD.dur)) AD.dur = 60;
  const cnt = d => { let n = 0; daySections(d).forEach(sec => sectionStarts(sec).forEach(m => { if (staffState(d, m, AD.dur) === 'ok') n++; })); return n; };
  if (AD.start != null && ['past', 'busy'].includes(staffState(DK, AD.start, AD.dur))) AD.start = null;
  let h = '<div class="card"><p class="step">① 選擇日期</p><div class="dates">' + dd.map(d => {
    const n = cnt(d);
    return '<button class="date ' + (d === DK ? 'on' : '') + (n ? '' : ' full') + '" onclick="DK=\'' + d + '\';AD.start=null;render()"><small>週' + wdOf(d) + '</small><b>' + md(d) + '</b><span class="cnt">' + (n ? '可約' : '額滿') + '</span></button>';
  }).join('') + '</div></div>';
  h += '<div class="card"><p class="step">② 預約多久</p><div class="durs">' + durs.map(m => '<button class="' + (AD.dur === m ? 'on' : '') + '" onclick="AD.dur=' + m + ';render()">' + durTxt(m) + '</button>').join('') + '</div></div>';
  h += '<div class="card"><p class="step">③ 選擇開始時間</p>' + LEGEND;
  daySections(DK).forEach(sec => {
    h += '<div class="sec"><div class="sn">' + sec.n + '</div><div class="sgrid">';
    sectionStarts(sec).forEach(m => {
      const st = staffState(DK, m, AD.dur), can = st === 'ok' || st === 'closed';
      h += '<button class="sl ' + (st === 'ok' ? 'ok' : st === 'busy' ? 'busy' : 'no') + (AD.start === m ? ' on' : '') + '" ' + (can ? 'onclick="AD.start=' + m + ';render()"' : 'disabled') + '>' + m2t(m) + '<small>～' + m2t(m + AD.dur) + '</small></button>';
    });
    h += '</div></div>';
  });
  const warn = AD.start != null && staffState(DK, AD.start, AD.dur) === 'closed';
  h += (warn ? '<p class="hint" style="margin-top:8px;color:#a1452f">⚠ 這個時段沒有開放（灰色），確定諮商師可以才排，系統會通知諮商師。</p>' : '<p class="hint" style="margin-top:8px">灰色（未開放）也可以點選，適合臨時加診；紅色已被預約，不能選。</p>') + '</div>';
  h += '<div class="card"><p class="step">④ 個案資料</p><div class="grid2">' +
    '<div class="full"><label>這位個案的 LINE（選填）</label><select class="f" id="da-l" onchange="adPickLine(this)"><option value="">沒有 LINE／不知道</option>' +
    D.clients.slice().sort((a, b) => (b.booked - a.booked) || String(a.name).localeCompare(String(b.name), 'zh-Hant')).map(c => '<option value="' + esc(c.uid) + '" data-n="' + esc(c.name) + '" data-p="' + esc(c.price || '') + '" data-t="' + esc(c.phone || '') + '"' + (AD.uid === c.uid ? ' selected' : '') + '>' + esc(c.name) + (c.booked ? '（曾用 LINE 預約）' : '（LINE 好友）') + '</option>').join('') + '</select></div>' +
    '<div><label>姓名</label><input class="f" id="da-n" maxlength="30" placeholder="例如：張先生" value="' + esc(AD.name) + '" oninput="AD.name=this.value"></div>' +
    '<div><label>電話（選填）</label><input class="f" id="da-p" inputmode="tel" placeholder="09xxxxxxxx" value="' + esc(AD.phone) + '" oninput="AD.phone=this.value"></div>' +
    '<div class="full"><label>收費（個案看不到）</label><select class="f" id="da-pr" onchange="AD.price=this.value"><option value="">未設定</option>' + (D.set.prices || []).map(p => '<option' + (AD.price === p ? ' selected' : '') + '>' + esc(p) + '</option>').join('') + '</select></div></div></div>';
  const ready = AD.start != null;
  h += '<div class="card">' + (ready ? '<div class="summary">' + md(DK) + '（週' + wdOf(DK) + '）' + m2t(AD.start) + '～' + m2t(AD.start + AD.dur) + '（' + durTxt(AD.dur) + '）</div>' : '') +
    '<button class="btn" ' + (ready && !busyReq ? '' : 'disabled') + ' onclick="deskAdd()">' + (ready ? '新增預約' : '請先選擇上面的時段') + '</button>' +
    '<p class="hint" style="text-align:center">選了個案的 LINE，他會收到 LINE 通知，以及預約前 24 小時的提醒。</p></div>';
  return h;
}
function adPickLine(sel) {
  const o = sel.selectedOptions[0]; AD.uid = sel.value; AD.from = '';
  if (o && o.dataset.n) AD.name = o.dataset.n;
  if (o && o.dataset.p) AD.price = o.dataset.p;
  if (o && o.dataset.t && !AD.phone) AD.phone = o.dataset.t;
  render();
}
async function deskAdd() {
  const f = { date: DK, start: AD.start, dur: AD.dur, uid: AD.uid, from: AD.from || '', name: AD.name.trim(), phone: AD.phone, price: AD.price };
  if (AD.start == null) return toast('請先選擇時段');
  if (!f.name) return toast('請填寫姓名');
  const r = await act(() => api('deskAdd', f), r => [r.clash ? '⚠ 這個時段和其他預約重疊了，請再確認！' : '', r.closed ? '⚠ 這段時間沒有開放，請確認諮商師可以' : '', r.viaLine ? '已用 LINE 通知個案' : '這位個案沒有 LINE，請另外通知'].filter(Boolean).join('\n'));
  if (r) { AD = { start: null, dur: 60, uid: '', name: '', phone: '', price: '' }; stab = 'sheet'; shSub = 'today'; render(); }
}

main();

</script>
</body>
</html>
